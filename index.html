<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="utf-8"/>
    <title>Kartverkskart</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.5.1/gpx.min.js"></script>

    <style>
        #map {
            height: 700px;
            width: 100%;
        }

        .leaflet-tooltip {
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h1>Trimkasser Blaker IL</h1>

<div id="map"></div>

<script type="text/javascript">

    // Sett startposisjon og zoom
    var map = L.map('map').setView([59.98, 11.35], 12.3);

    // Kartverkets topo-kart
    L.tileLayer('https://cache.kartverket.no/v1/wmts/1.0.0/topo/default/webmercator/{z}/{y}/{x}.png', {
        maxZoom: 18,
        attribution: '&copy; <a href="http://www.kartverket.no/">Kartverket</a>'
    }).addTo(map);

    // --- STABILE IKONER (SVG Data-URIs) ---

    // Blått parkeringsikon (P)
    var parkingIcon = L.icon({
        iconUrl: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="%230055A5"/><text x="16" y="23" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">P</text></svg>',
        iconSize: [20, 20],
        iconAnchor: [10, 10],
        popupAnchor: [0, -10]
    });

    // Rødt pennant icon
    var trimkasseIcon = L.icon({
        iconUrl: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="%23ff2e2e"><path d="M18.364 4.636a9 9 0 0 1 .203 12.519l-.203 .21l-4.243 4.242a3 3 0 0 1 -4.097 .135l-.144 -.135l-4.244 -4.243a9 9 0 0 1 12.728 -12.728zm-6.364 3.364a3 3 0 1 0 0 6a3 3 0 0 0 0 -6z" /></svg>',
        iconSize: [36, 36],
        iconAnchor: [18, 36],
        popupAnchor: [0, -36]
    });

    // --- MARKØRER ---

    // 1. Svarstadtjernet
    var marker1 = L.marker([60.01980, 11.36315], { icon: trimkasseIcon }).addTo(map);
    marker1.bindTooltip("Svarstadtjernet", {
        permanent: true,
        direction: "right",
        offset: [10, 0]
    });

    marker1.bindPopup(`
        <div style="text-align: center;">
            <h3 style="margin: 0 0 10px 0;">Svarstadtjernet</h3>
            <img src="Bilder/Svarstadtjernet.jpg" alt="Svarstadtjernet" style="width: 100%; height: auto; border-radius: 8px;">Svarstadtjernet ligger på toppen av Svarstadåsen, og delet mellom Lillestrøm kommune og Nes kommune går midt i tjernet. På østsiden av tjernet er det fint å bade. Det er fine stier til Svarstadtjernet fra Thoreidmoen, Rånåsfoss og Aulifeltet. <br><br> Koordinater: 60.01969 N 11.36310 E. </div>
    `, {
        maxWidth: 700,
        minWidth: 600
    });

    // 2. Igletjern
    var marker2 = L.marker([59.951063, 11.289591], { icon: trimkasseIcon }).addTo(map);
    marker2.bindTooltip("Igletjern", {
        permanent: true,
        direction: "right",
        offset: [10, 0]
    });

    marker2.bindPopup(`
        <div style="text-align: center;">
            <h3 style="margin: 0 0 10px 0;">Igletjern</h3>
            <img src="Bilder/Igletjern.jpg" alt="Igletjern" style="width: 100%; height: auto; border-radius: 8px;">Igletjern er lett tilgjengelig for hele familien. Om man parkerer Tertittveien er det grusvei og fin sti frem til tjernet. Det er en fint opparbeidet bålplass ved tjernet. Det sette hvert år ut ørret i vannet med gjennomsnittsvekt på 500 gram. Kjøp av fiskekort gjøres digitalt via iNatur.<br><br>Når det er forhold for det kjører Blaker IL skiløyper til Igletjern.<br><br>Koordinater: 59.95106 N 11.28959 E.</div>
    `, {
        maxWidth: 700,
        minWidth: 600
    });

    // 3. Gruva
    var marker3 = L.marker([59.996223, 11.338258], { icon: trimkasseIcon }).addTo(map);
    marker3.bindTooltip("Gruva", {
        permanent: true,
        direction: "right",
        offset: [10, 0]
    });

    marker3.bindPopup(`
        <div style="text-align: center;">
            <h3 style="margin: 0 0 10px 0;">Gruva</h3>
            <img src="Bilder/Gruva.jpg" alt="Gruva" style="width: 100%; height: auto; border-radius: 8px;">Kobbergruva på Skugstadåsen<br><br>I skogen her i Skugstadåsen finner du restene av en gammel kobbergruve fra starten av 1900-tallet.<br><br>Da den nasjonale «skjerpefeberen» raste tidlig på 1900-tallet satte håpefulle lykkejegere i gang med prøvedrift her. På det meste var over 20 mann i arbeid i gruveområdet.<br><br>I dag kan du se den vannfylte skråsjakta som fører hele 40 meter ned i fjellet, og spor etter driften som en gang var her. Kobber fra gruva ble fraktet til Blaker stasjon og sendt med tog til Røros for omsmelting.<br><br>Koordinater: 59.99622 N 11.33826 E.</div>
    `, {
        maxWidth: 700,
        minWidth: 600
    });

    // 4. Hauketjern
    var marker4 = L.marker([59.98782, 11.43835], { icon: trimkasseIcon }).addTo(map);
    marker4.bindTooltip("Hauketjern", {
        permanent: true,
        direction: "right",
        offset: [10, 0]
    });

    marker4.bindPopup(`
        <div style="text-align: center;">
            <h3 style="margin: 0 0 10px 0;">Hauketjern</h3>
            <img src="Bilder/Hauketjern.jpg" alt="Hauketjern" style="width: 100%; height: auto; border-radius: 8px;">Hauketjern er et idyllisk tjern der tre kommunegrenser møtes; midt i vannet møtes Lillestrøm, Nes og Aurskog-Høland kommuner.<br><br>Parkering på Bøssvegen. Om man ønsker en lenger tur kan man kombinere turen til Hauketjern med både Gjertrudsteinen og Fjuktjern.<br><br>Koordinater: 59.59162 N 1126181 E.</div>
    `, {
        maxWidth: 700,
        minWidth: 600
    });

    // 5. Gjertrudsteinen
    var marker5 = L.marker([59.984031, 11.388716], { icon: trimkasseIcon }).addTo(map);
    marker5.bindTooltip("Gjertrudsteinen", {
        permanent: true,
        direction: "right",
        offset: [10, 0]
    });

    marker5.bindPopup(`
        <div style="text-align: center;">
            <h3 style="margin: 0 0 10px 0;">Gjertrudsteinen</h3>
            <img src="Bilder/Gjertrudsteinen.jpg" alt="Gjertrudsteinen" style="width: 100%; height: auto; border-radius: 8px;">Gjertrudsteinen er en stein på rundt 20 kubikkmeter som ble fraktet hit av innlandsisen ved siste istid, og har ligget her i omtrent 10.000 år. Om man parkerer på Blaker skole er det en fin tur på grusvei og sti frem til Gjertrudsteinen. Dersom man ønsker er det fint å kombinere turen med en tur til trimkassen ved Fjuktjern.<br><br>Koordinater: 59.98403 N 11.38872 E.</div>
    `, {
        maxWidth: 700,
        minWidth: 600
    });

    // 6. Fleskeberget
    var marker6 = L.marker([60.00002, 11.40645], { icon: trimkasseIcon }).addTo(map);
    marker6.bindTooltip("Fleskeberget", {
        permanent: true,
        direction: "right",
        offset: [10, 0]
    });

    marker6.bindPopup(`
        <div style="text-align: center;">
            <h3 style="margin: 0 0 10px 0;">Fleskeberget</h3>
            <img src="Bilder/Fleskeberget.jpg" alt="Fleskeberget" style="width: 100%; height: auto; border-radius: 8px;">Fleskeberget er en høyde nord for Stagrim. Det er en stor stein der som man kan krype under.<br><br>Trimkassen på Fleskeberget står nøyaktig på 60° nord.<br><br> Koordinater: 60.00001 N 11.24232 E.</div>
    `, {
        maxWidth: 700,
        minWidth: 600
    });

    // 7. Fjuktjern
    var marker7 = L.marker([59.978936, 11.417797], { icon: trimkasseIcon }).addTo(map);
    marker7.bindTooltip("Fjuktjern", {
        permanent: true,
        direction: "right",
        offset: [10, 0]
    });

    marker7.bindPopup(`
        <div style="text-align: center;">
            <h3 style="margin: 0 0 10px 0;">Fjuktjern</h3>
            <img src="Bilder/Fjuktjern.jpg" alt="Fjuktjern" style="width: 100%; height: auto; border-radius: 8px;">Fjuktjern ligger på grensen mellom Lillestrøm kommune og Aurskog-Høland kommune. Man kan parkere på Blaker skole. På vei til tjernet kan man gå innom Gjertrudsteinen. På vei opp kan man også ta en hvil i gapahuken til Blaker IL, som er satt opp i enden av grusveien der man tar av på sti til Fjuktjern.<br><br>Det er fine berg rundt tjernet, der man kan spise matpakka mens man ser abboren vake.<br><br>Koordinater: 59.97894 N 11.41779 E.</div>
    `, {
        maxWidth: 700,
        minWidth: 600
    });

</script>

</body>
</html>
